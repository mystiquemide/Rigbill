name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Unit tests (BIP143 vectors, split rules, bill lifecycle)
        run: cargo test
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Wasm build
        run: cargo build --target wasm32-unknown-unknown --release

  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relayer/package-lock.json
      - run: npm ci
      - run: npx tsc
      - name: Tests (sighash parity, witness assembly, signature checks)
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx oxlint --deny-warnings
      - run: npm run build

  verify:
    name: Live proof (npm run verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the contract, NEAR and Bitcoin testnet and check every recorded proof
        run: npm run verify
